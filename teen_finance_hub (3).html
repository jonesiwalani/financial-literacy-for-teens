<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teen Finance Academy | Master Your Money</title>
    <style>
        :root {
            --primary: #ec4899;          /* Hot/Bubblegum Pink Accent */
            --primary-dark: #db2777;     /* Deep Rose Pink */
            --primary-light: #f472b6;    /* Soft Pink */
            --pink-accent: #ff8da1;      /* Coral Pink Accent */
            
            --bg: #fdf2f8;               /* Soft Pastel Blush Pink BG */
            --card-bg: #ffffff;          /* Crisp Clean White Cards */
            --card-border: #fbcfe8;      /* Soft Pastel Pink Border */
            --widget-bg: #fff0f5;        /* Soft Lavender-Blush Pink Widget */
            
            --text-main: #4c0519;        /* Rich Deep Berry Plum Text */
            --text-muted: #9f1239;       /* Muted Soft Deep Rose */
            
            --blue: #0284c7;             /* Sky Blue Accent */
            --purple: #9333ea;           /* Lavender Purple Accent */
            --yellow: #d97706;           /* Warm Gold Accent */
            --success: #15803d;
            --error: #e11d48;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Smooth Ombre Gradient blending Soft Pink to a richer, more pigmented Matcha Green */
            background: linear-gradient(135deg, #fdf2f8 0%, #f1e4ee 35%, #dcecd5 75%, #bce0b2 100%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.65;
            padding: 20px 12px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 920px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            position: relative;
        }

        .floral-lei-banner {
            font-size: 1.6rem;
            letter-spacing: 10px;
            margin-bottom: 6px;
            filter: drop-shadow(0 2px 4px rgba(219, 39, 119, 0.25));
        }

        .brand-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .cute-logo {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, #ff8da1, #db2777);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(219, 39, 119, 0.28);
            transform: rotate(-3deg);
        }

        .cute-logo svg {
            width: 38px;
            height: 38px;
            fill: white;
        }

        .brand-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 24px;
            scrollbar-width: thin;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--text-muted);
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: var(--primary-dark);
            box-shadow: 0 4px 0 var(--primary-dark);
        }

        .module-card {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(219, 39, 119, 0.08);
        }

        .module-title {
            font-size: 1.7rem;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .module-desc {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .lesson-section {
            background: #fff8fa;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin: 18px 0;
        }

        .lesson-section h3 {
            color: var(--primary-dark);
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .lesson-section ul, .lesson-section p {
            color: var(--text-main);
            font-size: 1rem;
        }

        .lesson-section ul {
            margin-left: 20px;
            margin-top: 8px;
        }

        .lesson-section li {
            margin-bottom: 8px;
        }

        .fact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .fact-card {
            background: #ffffff;
            border: 2px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(219, 39, 119, 0.05);
        }

        .fee-badge {
            background: var(--primary-dark);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER WITH HAWAIIAN PLUMERIA LEIS & GRADUATION CAP LOGO -->
        <header>
            <div class="floral-lei-banner">🌺 🌸 🌼 🌸 🌺</div>
            <div class="brand-container">
                <div class="cute-logo" title="Teen Finance Scholar">
                    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <!-- Graduation Cap -->
                        <polygon points="16,6 4,12 16,18 28,12" fill="#ffffff"/>
                        <path d="M10,15 L10,21 C10,24 22,24 22,21 L22,15" fill="#ffffff"/>
                        <path d="M22,13 L25,20 L24,22" stroke="#fbbf24" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                        <circle cx="24" cy="22.5" r="1" fill="#fbbf24"/>
                    </svg>
                </div>
                <div class="brand-text">Teen Finance</div>
            </div>
            <p class="subtitle">Master your money skills step-by-step!</p>
            <div class="floral-lei-banner" style="margin-top: 6px;">🌸 🌺 🌼 🌺 🌸</div>
        </header>

        <!-- NAVIGATION TABS -->
        <div class="nav-tabs" role="tablist">
            <button class="tab-btn active" onclick="switchTab('facts')">💡 Fast Facts</button>
            <button class="tab-btn" onclick="switchTab('budgeting')">📊 Budgeting</button>
            <button class="tab-btn" onclick="switchTab('savings')">📈 Savings & Emergency</button>
            <button class="tab-btn" onclick="switchTab('fees')">🏦 Banks & Fees</button>
            <button class="tab-btn" onclick="switchTab('paycheck')">🧾 Paychecks & Taxes</button>
            <button class="tab-btn" onclick="switchTab('credit')">⭐ Credit & Scores</button>
            <button class="tab-btn" onclick="switchTab('goals')">🎯 Goals & Insurance</button>
            <button class="tab-btn" onclick="switchTab('retirement')">💼 Retirement (IRA/401k)</button>
            <button class="tab-btn" onclick="switchTab('investing')">🚀 Investing & Stocks</button>
            <button class="tab-btn" onclick="switchTab('resources')">📚 More Resources</button>
        </div>

        <main id="main-content"></main>
    </div>

    <script>
        const ALL_FAST_FACTS = [
            { category: "💡 Budgeting", title: "The 50/30/20 Blueprint", desc: "Split your net income: 50% for essential needs, 30% for personal wants, and 20% directly into wealth-building savings." },
            { category: "📈 Savings", title: "Emergency Fund Shield", desc: "Keep 3 to 6 months of living expenses in a High-Yield Savings Account (HYSA) to protect against unexpected financial shocks." },
            { category: "🏦 Banks", title: "Avoiding Trap Fees", desc: "Watch out for monthly account maintenance fees and overdraft penalties. Maintain minimum balances and opt-out of overdraft protection." },
            { category: "🧾 Paychecks", title: "Gross vs. Net Pay", desc: "Gross pay is your pre-tax total wage, while net take-home pay is what actually enters your bank account after taxes and deductions." },
            { category: "⭐ Credit", title: "Payment History Power", desc: "Payment history makes up 35% of your FICO credit score. Always pay bills on time every month to build strong creditworthiness." },
            { category: "💼 Retirement", title: "Employer 401(k) Match", desc: "An employer match is 100% free money on your retirement contributions up to a specific percentage limit. Always claim your full match!" },
            { category: "🚀 Investing", title: "S&P 500 Diversification", desc: "Buying index funds gives you instant ownership shares in 500 top corporations, eliminating single-stock risk through broad market diversification." }
        ];

        function renderFacts() {
            return `
                <section class="module-card" style="background: linear-gradient(135deg, #fff0f5, #fce7f3); border: 2px solid var(--primary-light); text-align: center; padding: 32px;">
                    <h2 style="color: var(--primary-dark); font-size: 2rem; margin-bottom: 12px;">🌺 Aloha! Welcome to Financial Literacy for Teens!</h2>
                    <p style="font-size: 1.1rem; color: var(--text-main); max-width: 750px; margin: 0 auto; font-weight: 600;">
                        As teenagers like me progress into the next phase of their life, many challenges arise, including financially. Adulthood can be tricky, but managing your money doesn't have to be!
                    </p>
                </section>

                <section class="module-card">
                    <h2 class="module-title">💡 Detailed Money Fast Facts</h2>
                    <p class="module-desc">High-level insights covering budgeting, savings, banking, taxes, credit, retirement, and investing.</p>
                    <div class="fact-grid">
                        ${ALL_FAST_FACTS.map(f => `
                            <div class="fact-card">
                                <span class="fee-badge" style="margin-bottom: 8px; display:inline-block;">${f.category}</span>
                                <div class="fact-title">${f.title}</div>
                                <div class="fact-desc" style="font-size: 0.92rem; color: var(--text-main); margin-top: 6px;">${f.desc}</div>
                            </div>
                        `).join('')}
                    </div>
                </section>
            `;
        }

        function switchTab(tabKey) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('onclick').includes(tabKey)));
            const main = document.getElementById('main-content');
            
            if (tabKey === 'facts') {
                main.innerHTML = renderFacts();
            } else if (tabKey === 'budgeting') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">📊 Budgeting & Smart Purchasing</h2>
                        <p class="module-desc">A budget is a plan that helps you track income and expenses so you know exactly where your money goes each month. According to Investopedia, budgeting is one of the most effective ways to control spending, saving, and investing.</p>
                        
                        <div class="lesson-section">
                            <h3>Important Facts</h3>
                            <ul>
                                <li>Track every source of income.</li>
                                <li>Record all expenses.</li>
                                <li>Compare income with expenses every month.</li>
                                <li>Set financial goals before deciding how to spend extra money.</li>
                                <li>Adjust spending habits when expenses exceed income.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>The 50/30/20 Rule</h3>
                            <p>A common budgeting guideline:</p>
                            <ul>
                                <li><strong>50%</strong> → Needs (housing, food, transportation)</li>
                                <li><strong>30%</strong> → Wants (entertainment, hobbies)</li>
                                <li><strong>20%</strong> → Savings and investments</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Why Budgeting Matters</h3>
                            <ul>
                                <li>Prevents overspending</li>
                                <li>Helps build savings</li>
                                <li>Reduces financial stress</li>
                                <li>Makes long-term goals achievable</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Lifestyle Inflation</h3>
                            <p><strong>Definition:</strong> Lifestyle inflation occurs when spending increases as income increases (e.g., buying a more expensive car after a raise or moving into a larger apartment without increasing savings).</p>
                            <p style="margin-top: 8px;"><strong>Expert Tip:</strong> Experts recommend increasing savings along with income instead of letting all additional earnings become new spending.</p>
                        </div>

                        <div class="lesson-section">
                            <h3>Smart Purchasing Decisions</h3>
                            <p>Before buying, ask yourself: <em>Do I need this? Can I afford it? Have I compared prices? Will I still want it in a week?</em></p>
                            <p style="margin-top: 8px;">Good purchasing habits include reading reviews, comparing prices, avoiding impulse purchases, and understanding warranties and return policies.</p>
                        </div>
                    </section>`;
            } else if (tabKey === 'savings') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">📈 Emergency Fund & Savings</h2>
                        <p class="module-desc">An emergency fund is money set aside specifically for unexpected expenses or financial emergencies.</p>
                        
                        <div class="lesson-section">
                            <h3>Common Emergencies</h3>
                            <ul>
                                <li>Car repairs & maintenance</li>
                                <li>Medical bills</li>
                                <li>Job loss or sudden reduction in hours</li>
                                <li>Home repairs</li>
                                <li>Emergency travel</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Important Facts</h3>
                            <ul>
                                <li>Even small savings improve financial security.</li>
                                <li>Without savings, people often rely on credit cards or loans, creating high-interest debt.</li>
                                <li>Emergency savings should never be used for routine lifestyle expenses.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Recommended Savings Goal</h3>
                            <ul>
                                <li>Start with a starter goal of <strong>$500–$1,000</strong>.</li>
                                <li>Eventually save <strong>3 to 6 months</strong> of living expenses once financially independent.</li>
                            </ul>
                        </div>
                    </section>`;
            } else if (tabKey === 'fees') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">🏦 Checking vs. Savings & Common Banking Fees</h2>
                        <p class="module-desc">Understanding how financial institutions operate helps you protect your cash and avoid unnecessary costs.</p>
                        
                        <div class="lesson-section">
                            <h3>Checking Account</h3>
                            <p>Designed for daily liquidity: paying bills, debit card purchases, direct deposits, and frequent withdrawals.</p>
                        </div>

                        <div class="lesson-section">
                            <h3>Savings Account</h3>
                            <p>Designed for saving money, earning interest, emergency funds, and future goals.</p>
                        </div>

                        <div class="lesson-section">
                            <h3>Common Banking Fees to Be Aware Of</h3>
                            <ul>
                                <li><strong>Monthly Maintenance / Service Fees:</strong> Charged by some banks if your account balance falls below a minimum requirement. (Pro tip: Always look for free student checking accounts or accounts with no monthly fees).</li>
                                <li><strong>Overdraft & Insufficient Funds (NSF) Fees:</strong> Charged when you try to spend or withdraw more money than you currently have in your checking account. (Pro tip: Opt-out of overdraft protection so your card declines instead of charging a ~$35 penalty fee).</li>
                                <li><strong>Out-of-Network ATM Fees:</strong> Surcharges applied when you use an ATM machine belonging to a different bank or independent operator.</li>
                                <li><strong>Wire Transfer Fees:</strong> Fees charged by banks to electronically transfer money to another bank account.</li>
                                <li><strong>Paper Statement Fees:</strong> Small monthly charges if you choose to receive physical paper mail statements instead of paperless electronic statements.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Important Banking Facts</h3>
                            <ul>
                                <li>Savings accounts generally earn more interest than checking accounts.</li>
                                <li>High-yield savings accounts (HYSAs) provide superior annual percentage yields.</li>
                                <li>Keeping money in a bank is safer than storing cash because eligible deposits are protected by federal insurance limits (FDIC / NCUA).</li>
                            </ul>
                        </div>
                    </section>`;
            } else if (tabKey === 'paycheck') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">🧾 Understanding Your Paycheck & Common Types of Taxes</h2>
                        <p class="module-desc">Decoding your paystub and understanding how different taxes fund our society.</p>
                        
                        <div class="lesson-section">
                            <h3>Important Parts of a Paycheck</h3>
                            <ul>
                                <li><strong>Gross Pay:</strong> Total earnings before any deductions or tax withholdings.</li>
                                <li><strong>Net Pay:</strong> Money you actually receive in your bank account.</li>
                                <li><strong>Taxes Withheld:</strong> Federal, state, and payroll taxes taken out automatically.</li>
                                <li><strong>Other Deductions:</strong> Employer-sponsored insurance, retirement contributions, etc.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Common Types of Taxes</h3>
                            <ul>
                                <li><strong>Federal Income Tax:</strong> A tax levied by the federal government on your annual earnings, used to fund national defense, federal programs, and international relations.</li>
                                <li><strong>State Income Tax:</strong> A tax charged by many individual states on your earnings to fund local public services like state parks, police, and state highways. (Note: Some states do not have state income tax).</li>
                                <li><strong>FICA Taxes (Social Security & Medicare):</strong> Mandatory payroll taxes. FICA takes 6.2% for Social Security (which funds retirement and disability benefits for seniors) and 1.45% for Medicare (which funds healthcare for older adults).</li>
                                <li><strong>Sales Tax:</strong> A consumption tax added to the purchase price of retail goods and services at the register.</li>
                                <li><strong>Property Tax:</strong> A tax paid by homeowners based on the estimated value of their land and buildings, which primarily funds local public schools.</li>
                            </ul>
                        </div>
                    </section>`;
            } else if (tabKey === 'credit') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">⭐ Credit Cards, Loans & Credit Scores</h2>
                        <p class="module-desc">Managing credit responsibly is one of the most critical elements of long-term financial health.</p>
                        
                        <div class="lesson-section">
                            <h3>Credit Cards & APR</h3>
                            <p>A credit card allows you to borrow money from a lender up to a set credit limit. <strong>APR (Annual Percentage Rate)</strong> determines how much interest you'll pay if you carry a balance.</p>
                            <ul>
                                <li><strong>Benefits:</strong> Fraud protection, rewards/cash back, builds credit history, convenient for online shopping.</li>
                                <li><strong>Rule of Thumb:</strong> Always pay your balance in full every month to avoid interest. Carrying balances or paying only the minimum leads to costly long-term debt.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Credit Scores & Reports</h3>
                            <p>A credit score (typically ranging from 300–850) predicts how likely you are to repay borrowed money. Lenders use it for credit cards, car loans, mortgages, apartment rentals, and insurance rates.</p>
                            <ul>
                                <li><strong>Key Factors:</strong> Paying bills on time, credit utilization (how much available credit you use), length of credit history, new credit inquiries, and credit mix.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Debt & Loans: Good vs. Bad Debt</h3>
                            <ul>
                                <li><strong>Good Debt:</strong> May help build future wealth (e.g., student loans, mortgages).</li>
                                <li><strong>Bad Debt:</strong> High-interest consumer borrowing (e.g., credit card debt, payday loans, high-interest personal loans). Always review interest rates, terms, and total repayment costs.</li>
                            </ul>
                        </div>
                    </section>`;
            } else if (tabKey === 'goals') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">🎯 Financial Goals, Insurance & Scams</h2>
                        <p class="module-desc">Setting concrete targets, protecting your assets, and identifying financial fraud.</p>
                        
                        <div class="lesson-section">
                            <h3>Financial Goal Setting (SMART)</h3>
                            <p>Goals work best when they are <strong>S</strong>pecific, <strong>M</strong>easurable, <strong>A</strong>chievable, <strong>R</strong>elevant, and <strong>T</strong>ime-bound. Short-term goals include saving $1,000 for emergencies or buying a car; long-term goals include buying a house or saving for retirement.</p>
                        </div>

                        <div class="lesson-section">
                            <h3>Insurance Basics</h3>
                            <p>Insurance protects you from major financial losses. Instead of paying the full cost of an unexpected event yourself, you pay regular premiums, and the insurer helps cover eligible losses under health, auto, renters, homeowners, or life insurance policies.</p>
                        </div>

                        <div class="lesson-section">
                            <h3>Recognizing Financial Scams</h3>
                            <p>Common scams include phishing emails, fake investments, identity theft, and gift card fraud. Warning signs include pressure to act immediately, guaranteed high profits, and requests for payment via gift cards or cryptocurrency.</p>
                        </div>
                    </section>`;
            } else if (tabKey === 'retirement') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">💼 Retirement Accounts: IRAs & 401(k)s</h2>
                        <p class="module-desc">Planning for retirement early lets decades of compound interest build incredible wealth with major tax advantages.</p>
                        
                        <div class="lesson-section">
                            <h3>Employer-Sponsored 401(k) & Matching</h3>
                            <p>A 401(k) is a retirement savings plan sponsored by your employer. Many companies offer an <strong>employer match</strong> (e.g., matching 3% of your salary if you contribute 3%). This is free money—always contribute enough to secure the full match!</p>
                        </div>

                        <div class="lesson-section">
                            <h3>What is an Individual Retirement Account (IRA)?</h3>
                            <p>An IRA is a personal tax-advantaged savings account you set up independently through a brokerage firm to save for retirement. There are two primary types of IRAs:</p>
                            <ul>
                                <li><strong>Traditional IRA:</strong> Contributions are made with pre-tax dollars (meaning you get a tax deduction in the year you make the contribution), but you pay ordinary income tax when you withdraw the money in retirement.</li>
                                <li><strong>Roth IRA:</strong> Contributions are made with after-tax dollars today. The incredible advantage of a Roth IRA is that all decades of compound investment growth and all future withdrawals in retirement are <strong>100% tax-free!</strong> This makes Roth IRAs an exceptionally powerful tool for young adults and teenagers with earned income.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Compound Interest in Retirement</h3>
                            <p>Because retirement accounts are invested in the stock market over 30 to 40 years, compound interest creates exponential wealth. Starting in your teens or twenties means your money has decades to multiply many times over.</p>
                        </div>
                    </section>`;
            } else if (tabKey === 'investing') {
                main.innerHTML = `
                    <section class="module-card">
                        <h2 class="module-title">🚀 Investing & Stocks</h2>
                        <p class="module-desc">Investing puts your money to work in financial markets, allowing your wealth to outpace inflation and compound over time.</p>
                        
                        <div class="lesson-section">
                            <h3>What is a Stock and Why is it Useful?</h3>
                            <p>A <strong>stock</strong> represents a fractional ownership share in a publicly traded corporation (like Apple, Nike, or Disney). When you buy a stock, you become a partial owner (a shareholder) of that company. Stocks are useful because they allow everyday people to share in the growth and profits of major businesses, historically offering higher long-term returns than traditional savings accounts to help your money outpace inflation.</p>
                        </div>

                        <div class="lesson-section">
                            <h3>Good Investments vs. Bad Investments</h3>
                            <p>Understanding whether something tends to appreciate (go up) or depreciate (go down) in value is key to building wealth:</p>
                            <ul>
                                <li><strong>Good Investments (Tend to Appreciate):</strong> Assets that generate income or grow in value over time. Examples include stocks, index funds, real estate, and education/skills that boost your earning potential.</li>
                                <li><strong>Bad Investments / Depreciating Assets:</strong> Things that lose value rapidly the moment you buy them or use them. Examples include brand-new cars (which lose value immediately), designer clothes, consumer electronics bought on credit, or high-interest consumer debt.</li>
                            </ul>
                        </div>

                        <div class="lesson-section">
                            <h3>Common Investment Vehicles</h3>
                            <p>Common investment vehicles include stocks, bonds, Exchange-Traded Funds (ETFs), mutual funds, and index funds. Investments carry varying levels of risk, but <strong>diversification</strong> across different assets helps reduce overall risk.</p>
                        </div>
                    </section>`;
            } else if (tabKey === 'resources') {
